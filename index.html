<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카드 정산</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1EF;--card:#fff;--ink:#14302A;--mut:#5E716B;--line:#D3DDD9;--yong:#2E5E8C;--gaeng:#A63D6E;--fix:#8A9A94;--warn:#B45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Noto Sans KR',system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:720px;margin:0 auto;padding:12px 14px 80px}
nav{position:sticky;top:0;z-index:5;background:var(--ink);display:flex;justify-content:center;gap:4px;padding:8px}
nav button{flex:1;max-width:200px;border:0;background:none;color:#B8C9C3;padding:9px 0;border-radius:8px;font:500 15px inherit;font-family:inherit;cursor:pointer}
nav button.on{background:#fff;color:var(--ink);font-weight:700}
nav .gear{flex:0 0 40px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--yong);outline-offset:2px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
.bar select{flex:1;font:700 18px inherit;font-family:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.ib{border:1px solid var(--line);background:#fff;border-radius:8px;width:40px;height:40px;font-size:16px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.grid div{background:var(--card);border-radius:8px;padding:8px 6px;border-top:3px solid var(--k)}
.grid small{display:block;color:var(--mut);font-size:12px}.grid b{font-size:14px}
.slip{background:#fff;border:2px dashed var(--gaeng);border-radius:6px;padding:16px;margin-bottom:14px}
.slip h2{margin:0;font-size:14px;color:var(--gaeng);font-weight:700}
.slip .amt{font-size:32px;font-weight:700;margin:2px 0}
.slip p{margin:0 0 12px;color:var(--mut);font-size:13px}
.btn{border:0;background:var(--ink);color:#fff;border-radius:8px;padding:11px 14px;font:700 15px inherit;font-family:inherit;cursor:pointer}
.btn.sub{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.row{display:flex;gap:10px;align-items:center}.row label{display:flex;gap:6px;align-items:center;font-size:14px}
.warn{background:#FFF7E8;border-left:4px solid var(--warn);padding:10px 12px;border-radius:4px;margin-bottom:14px;font-size:13px}
.warn b{color:var(--warn)}.warn div{margin-top:4px}
.chips{display:flex;gap:6px;margin-bottom:8px}.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font:inherit;cursor:pointer;color:var(--mut)}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.item .dt{width:34px;color:var(--mut);font-size:13px}.item .nm{flex:1;min-width:0}.item .nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm small{color:var(--mut)}.item .am{font-weight:500}.neg{color:var(--gaeng)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;color:#fff;margin-right:4px}
.tag.y{background:var(--yong)}.tag.g{background:var(--gaeng)}.tag.f{background:var(--fix)}
.box{background:#fff;border-radius:8px;padding:12px;margin-bottom:12px}.box h3{margin:0 0 8px;font-size:15px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:6px}.f select,.f input{padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;min-width:0}.f .w{grid-column:1/-1}
.hb{height:10px;background:var(--line);border-radius:3px;display:flex;overflow:hidden;margin-top:3px}
.hb i{display:block;height:100%}
.empty{padding:30px 10px;text-align:center;color:var(--mut)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1}
.f label{display:flex;gap:6px;align-items:center}.f label input{padding:0}.dd{margin:-4px 0 10px;color:var(--mut);font-size:13px}.dd b{color:var(--ink)}.stp{display:flex;gap:8px;align-items:center;padding:5px 0}.stp small{margin-left:auto;color:var(--mut)}.ck{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}.ck.ok{background:var(--ink);color:#fff;border-color:var(--ink)}[data-sp]{cursor:pointer}.acts{position:sticky;top:52px;z-index:4;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:8px}.acts .sm{padding:5px 9px;font-size:13px;margin:3px 3px 0 0}.rv{align-items:flex-start}.rv.fl{background:#FFF7E8}.ck2{width:20px;height:20px;margin-top:3px;flex:none}.rl{display:block;white-space:normal;font-size:12px;color:var(--mut)}.rl b{color:var(--warn);font-weight:500}.tag.c{background:#5E716B}.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-bottom:14px}.cg div{background:var(--card);border-radius:8px;padding:8px;border-left:3px solid var(--ink)}.cg small{display:block;color:var(--mut);font-size:12px}.cg b{font-size:15px}.mdl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}.sh{background:#fff;width:100%;max-width:720px;border-radius:14px 14px 0 0;padding:16px 16px 24px;display:grid;gap:10px}.sh h3{margin:0}.sh label{display:grid;gap:4px;font-size:13px;color:var(--mut)}.sh select,.sh input{padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:16px;color:var(--ink);background:#fff}.sh .row{justify-content:flex-end}</style></head><body>
<nav><button data-t="m">이번 달 정산</button><button data-t="r">고정비규칙</button><button data-t="s">누적통계</button><button class="gear" id="gear" aria-label="연결 설정">⚙</button></nav>
<main id="v"><div class="empty">불러오는 중…</div></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>(n<0?'-':'')+Math.abs(n).toLocaleString('ko-KR'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={rows:[],rules:[],paid:{},m:'',tab:'m',f:'all'},YR=new Date().getFullYear();
const cfg=()=>({u:localStorage.getItem('u')||'',t:localStorage.getItem('t')||''});
function toast(t){const e=$('#toast');e.textContent=t;e.className='on';setTimeout(()=>e.className='',1600)}
async function post(o){const c=cfg();try{return await(await fetch(c.u,{method:'POST',body:JSON.stringify({token:c.t,...o})})).json()}catch(e){return{}}}
async function load(){
  const c=cfg();if(!c.u){return setup()}
  let r;
  try{r=await(await fetch(c.u+'?token='+encodeURIComponent(c.t))).json();if(r.error)throw new Error('비밀번호(TOKEN)가 Code.gs와 달라요')}
  catch(e){const m=e.name==='SyntaxError'?'응답이 올바르지 않아요. 웹앱 액세스 권한이 "모든 사용자"인지, 시트에서 연 Apps Script인지 확인하세요':e.name==='TypeError'?'주소에 접근할 수 없어요. /exec 주소인지, 권한 승인과 재배포를 확인하세요':e.message;
    $('#v').innerHTML='<div class="empty">시트에 연결하지 못했어요.<br><b>'+esc(m)+'</b><br><br><button class="btn" onclick="setup()">연결 설정</button></div>';return}
  S.rows=r.rows.map(x=>({...x,m:x.m||''}));const cn={};S.rows.forEach(x=>{const b=x.m+'|'+x.shop+'|'+x.amt;cn[b]=(cn[b]||0)+1;x.k=cn[b]>1?b+'#'+cn[b]:b});S.rules=r.rules;S.paid=r.paid;S.closed=r.closed||{};S.cfg=r.cfg||{};
  const ms=months();if(!S.m||!ms.includes(S.m)){const now=new Date().toISOString().slice(0,7);S.m=ms.includes(now)?now:ms[0]||''}
  try{render()}catch(e){$('#v').innerHTML='<div class="empty">화면 오류: '+esc(e.message)+'</div>'}
}
function setup(){const u=prompt('Apps Script 웹앱 주소',cfg().u);if(u===null)return;const t=prompt('비밀번호(Code.gs의 TOKEN)',cfg().t);if(t===null)return;localStorage.setItem('u',u.trim());localStorage.setItem('t',t.trim());load()}
const bad=x=>!/^\d{4}-(0[1-9]|1[0-2])$/.test(x.m)||+x.m.slice(0,4)<YR-1;
const months=()=>[...new Set(S.rows.filter(x=>!bad(x)).map(x=>x.m))].sort().reverse();
const isFix=x=>S.rules.some(r=>r.fix&&x.shop.toLowerCase().includes(r.keyword.toLowerCase()));
const kx=x=>x.k,sp=x=>{const c=S.cfg[kx(x)];return c&&c.s!=null?+c.s:null},gShare=x=>{const s=sp(x);return s!=null?Math.round(x.amt*s/100):(x.user==='갱이'?x.amt:0)};
const unm=()=>[...new Set(S.rows.filter(x=>!bad(x)&&!S.rules.some(r=>x.shop.toLowerCase().includes(r.keyword.toLowerCase()))).map(x=>x.shop.replace(/\s*[\(\|].*$/,'').trim()))].slice(0,10);
const dday=()=>{const n=new Date(),y=n.getFullYear(),o=n.getMonth();const t=new Date(y,n.getDate()>14?o+1:o,14);return{d:Math.round((t-new Date(y,o,n.getDate()))/864e5),l:(t.getMonth()+1)+'/14'}};
function sum(m){const rs=S.rows.filter(x=>x.m===m);let t=0,fx=0,gg=0;rs.forEach(x=>{t+=x.amt;if(isFix(x))fx+=x.amt;else gg+=gShare(x)});return{rs,t,fx,gg,yy:t-gg}}
function issues(){const o=[],g={};S.rows.forEach(x=>{const k=x.m+'|'+x.shop+'|'+x.amt;(g[k]=g[k]||[]).push(x)});
  S.rows.forEach(x=>{let w='';if(bad(x))w='월 미정 → [월 이동] 필요';else if(x.amt>=20000&&g[x.m+'|'+x.shop+'|'+x.amt].length>1)w='중복 의심(참고)';if(w)o.push({x,w})});return o.filter(q=>!(S.cfg[kx(q.x)]||{}).i)}
const mm=d=>"'"+d.slice(2,4)+'.'+(+d.slice(5,7))+'.'+(d.slice(8,10)==='00'?'?':+d.slice(8,10));
const nextMon=m=>{const[y,n]=m.split('-').map(Number);return(n%12+1)+'/14'};
function kakao(m){const s=sum(m),n=+m.slice(5);const l=s.rs.filter(x=>!isFix(x)&&gShare(x)!==0).sort((a,b)=>a.d<b.d?-1:1);
  return`[${n}월 카드 정산]\n갱이 입금액: ${fmt(s.gg)}원\n${nextMon(m)} 인출 예정 · 용이 계좌로 입금 부탁해요\n\n`+l.map(x=>`${x.shop} ${fmt(gShare(x))}${sp(x)!=null?' ('+fmt(x.amt)+'의 '+sp(x)+'%)':''}`).join('\n')}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}).then?.(()=>{});toast('복사했어요. 카톡에 붙여넣으세요')}
function render(){document.querySelectorAll('nav button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));({m:vM,r:vR,s:vS})[S.tab]()}
const ruleOf=x=>S.rules.filter(r=>x.shop.toLowerCase().includes(r.keyword.toLowerCase())).sort((a,b)=>b.keyword.length-a.keyword.length)[0];
function review(x,iw){const r=ruleOf(x),n=[],w=iw[kx(x)];if(w)n.push(w);
  if(!r)n.push('규칙 없음');else{if(r.owner&&r.owner!==x.user)n.push('담당자 불일치(규칙 '+r.owner+')');if(r.cat&&x.cat&&r.cat!==x.cat)n.push('카테고리 불일치(규칙 '+r.cat+')')}
  if(x.amt<0)n.push('취소/환불 → 차감');return{r,n,flag:n.some(t=>t[0]!=='취')}}
function row(x,cl,iw,full){const v=review(x,iw),f=isFix(x),p=sp(x),k=kx(x);
  return`<div class="item rv ${v.flag&&full?'fl':''}"><input type="checkbox" class="ck2" data-k="${esc(k)}" ${S.sel.has(k)?'checked':''} ${cl?'hidden':''} aria-label="선택"><div class="nm" style="flex:1"><span>${esc(x.shop)}${bad(x)?' <b style="color:var(--warn)">['+esc(x.m||'월 미정')+']</b>':''}</span><small><span class="tag ${f?'f':x.user==='갱이'?'g':'y'}">${f?'고정':esc(x.user)}</span><span class="tag c">${esc(x.card||'카드?')}</span>${p!=null?'<span class="tag g">갱이 '+p+'%</span>':''}${esc(x.cat||'')}</small>${full?`<small class="rl">${v.r?'규칙 “'+esc(v.r.keyword)+'” → '+esc(v.r.owner)+'·'+esc(v.r.cat)+(v.r.fix?'·고정':''):'적용된 규칙 없음'} ${v.n.length?'<b>⚠ '+v.n.map(esc).join(' · ')+'</b>':'✓ 일치'}</small>`:''}</div><span class="am ${x.amt<0?'neg':''}">${fmt(x.amt)}</span></div>`}
const AU='자동(규칙 적용)',DEFC=['롯데카드','삼성카드','신한카드','현대카드','KB국민카드','우리카드','하나카드','BC카드','NH농협카드'];
const cards=()=>[...new Set([...S.rows.map(x=>x.card).filter(Boolean),...DEFC])],cats=()=>[...new Set([...S.rules.map(r=>r.cat),...S.rows.map(x=>x.cat)].filter(Boolean))];
function ask(t,F){return new Promise(res=>{const d=document.createElement('div');d.className='mdl';
  d.innerHTML=`<div class="sh"><h3>${t}</h3>${F.map((f,i)=>`<label>${f.l}${f.t==='select'?`<select id="f${i}">${f.o.map(o=>`<option ${o===f.v?'selected':''}>${esc(o)}</option>`).join('')}${f.c?'<option value="__c">직접 입력…</option>':''}</select>${f.c?`<input id="c${i}" placeholder="직접 입력" hidden>`:''}`:`<input id="f${i}" type="${f.t}" value="${esc(f.v||'')}" ${f.ph?`placeholder="${f.ph}"`:''} ${f.t==='number'?'inputmode="numeric"':''}>`}</label>`).join('')}<div class="row"><button class="btn sub" id="mx">취소</button><button class="btn" id="mk">확인</button></div></div>`;
  document.body.appendChild(d);F.forEach((f,i)=>{if(f.c)$('#f'+i).onchange=e=>{$('#c'+i).hidden=e.target.value!=='__c'}});
  const close=v=>{d.remove();res(v)};$('#mx').onclick=()=>close(null);d.onclick=e=>{if(e.target===d)close(null)};
  $('#mk').onclick=()=>close(F.map((f,i)=>{let v=$('#f'+i).value;if(v==='__c')v=$('#c'+i).value.trim();return v}))})}
async function addRow(){const o=await ask('내역 추가',[{l:'정산월',t:'month',v:S.m},{l:'카드사',t:'select',o:cards(),c:1,v:cards()[0]},{l:'가맹점',t:'text',ph:'예: 쿠팡'},{l:'금액 (취소는 -)',t:'number',ph:'0'},{l:'담당자',t:'select',o:[AU,'용이','갱이']},{l:'카테고리',t:'select',o:[AU,...cats()],c:1}]);
  if(!o)return;const[m,card,shop,amt,ow,cat]=o,r=ruleOf({shop});
  if(!/^\d{4}-\d{2}$/.test(m)||!shop||!amt||isNaN(+amt))return toast('정산월·가맹점·금액을 입력하세요');
  const user=ow===AU?(r&&r.owner):ow,ct=cat===AU?(r?r.cat:'기타'):cat;if(!user)return toast('적용할 규칙이 없어요. 담당자를 선택하세요');
  await post({action:'addRow',m,card,shop,amt:+amt,user,cat:ct});S.selM=null;await load();toast('추가했어요')}
async function act(a){const R=S.rows.filter(x=>S.sel.has(kx(x)));if(!R.length)return toast('항목을 먼저 체크하세요');const K=R.map(kx),bulk=async ops=>{const r=await post({action:'bulk',ops});S.selM=null;await load();toast((r.ok||0)+'건 처리했어요')},mk=(x,t,v)=>({r:x.r,shop:x.shop,amt:x.amt,t,v});
  if(a==='ok'||a==='re'){K.forEach(k=>S.cfg[k]={...(S.cfg[k]||{}),i:a==='ok'});S.selM=null;vM();return post({action:'rows',keys:K,i:a==='ok'})}
  if(a==='sp'){const o=await ask('갱이 부담 비율',[{l:'비율',t:'select',o:['해제(원래대로)',...Array.from({length:11},(_,i)=>i*10+'%')],v:'해제(원래대로)'}]);if(!o)return;const n=o[0][0]==='해'?null:parseInt(o[0]);K.forEach(k=>S.cfg[k]={...(S.cfg[k]||{}),s:n});vM();return post({action:'rows',keys:K,s:n})}
  if(a==='용이'||a==='갱이'){R.forEach(x=>x.user=a);vM();return bulk(R.map(x=>mk(x,'user',a)))}
  if(a==='ct'){const o=await ask('카테고리 변경',[{l:'카테고리',t:'select',o:cats(),c:1,v:R[0].cat}]);if(!o||!o[0])return;R.forEach(x=>x.cat=o[0]);vM();return bulk(R.map(x=>mk(x,'cat',o[0])))}
  if(a==='card'){const o=await ask('카드사 변경',[{l:'카드사',t:'select',o:cards(),c:1,v:R[0].card}]);if(!o||!o[0])return;R.forEach(x=>x.card=o[0]);vM();return bulk(R.map(x=>mk(x,'card',o[0])))}
  if(a==='mo'){const o=await ask('정산월 이동',[{l:'정산월',t:'month',v:S.m}]);if(!o||!/^\d{4}-(0[1-9]|1[0-2])$/.test(o[0]))return toast('월을 선택하세요');R.forEach(x=>x.m=o[0]);S.m=o[0];vM();return bulk(R.map(x=>mk(x,'mo',o[0])))}
  if(a==='del'){if(confirm(R.length+'건을 시트에서 삭제할까요?\n(시트 버전 기록에서 복구 가능)'))return bulk(R.map(x=>mk(x,'del')))}}
function vM(){const ms=months();if(!S.m)return $('#v').innerHTML='<div class="empty">시트에 내역이 없어요.</div>';
  const s=sum(S.m),un=unm(),i=ms.indexOf(S.m),cl=!!S.closed[S.m],pd=!!S.paid[S.m],dd=dday(),pm=ms[i+1],pc={},cc={},ct=x=>x.cat||'기타',iw={},ap=x=>!!(S.cfg[kx(x)]||{}).i;
  issues().forEach(o=>iw[kx(o.x)]=o.w);
  const mine=S.rows.filter(x=>x.m===S.m),pend=mine.concat(S.rows.filter(x=>!ms.includes(x.m))).filter(x=>!ap(x)),done=mine.filter(ap);
  pend.sort((a,b)=>review(b,iw).flag-review(a,iw).flag||(a.d<b.d?1:-1));
  if(S.selM!==S.m){S.sel=new Set(pend.filter(x=>!review(x,iw).flag).map(kx));S.selM=S.m}
  if(pm)sum(pm).rs.forEach(x=>pc[ct(x)]=(pc[ct(x)]||0)+x.amt);s.rs.forEach(x=>cc[ct(x)]=(cc[ct(x)]||0)+x.amt);
  const up=pm?Object.keys(cc).filter(k=>cc[k]-(pc[k]||0)>=50000&&cc[k]>=(pc[k]||0)*1.5).map(k=>k+' +'+fmt(cc[k]-(pc[k]||0))):[];
  const cd={};s.rs.forEach(x=>{const c=x.card||'카드 미지정';cd[c]=cd[c]||{a:0,n:0};cd[c].a+=x.amt;cd[c].n++});
  let dl=done.slice().sort((a,b)=>a.d<b.d?1:-1);
  if(S.f==='용이'||S.f==='갱이')dl=dl.filter(x=>x.user===S.f);if(S.f==='fix')dl=dl.filter(isFix);
  const st=[['① 1차 점검',pend.length?pend.length+'건 승인 대기':'완료',!pend.length],['② 규칙 없는 가맹점',un.length?un.length+'곳 → 고정비규칙 탭':'없음',!un.length],['③ 갱이에게 입금 요청','[카톡용 복사]',pd],['④ 입금 확인',pd?'완료':'입금되면 체크',pd],['⑤ 월 마감',cl?'마감됨':'①~④ 후 마감',cl]];
  const B=[['ok','승인'],['re','재점검'],['용이','담당→용이'],['갱이','담당→갱이'],['mo','월 이동'],['sp','분담%'],['ct','카테고리'],['card','카드사'],['del','삭제']];
  $('#v').innerHTML=`<div class="bar"><button class="ib" id="pv" aria-label="이전 달" ${i>=ms.length-1?'disabled':''}>◀</button><select id="ms">${ms.map(m=>`<option ${m===S.m?'selected':''} value="${m}">${m.slice(0,4)}년 ${+m.slice(5)}월 사용분</option>`).join('')}</select><button class="ib" id="nx" aria-label="다음 달" ${i<=0?'disabled':''}>▶</button></div>
  <div class="grid"><div style="--k:var(--ink)"><small>총 인출</small><b>${fmt(s.t)}</b></div><div style="--k:var(--yong)"><small>용이 부담</small><b>${fmt(s.yy)}</b></div><div style="--k:var(--gaeng)"><small>갱이 부담</small><b>${fmt(s.gg)}</b></div><div style="--k:var(--fix)"><small>고정비</small><b>${fmt(s.fx)}</b></div></div>
  <div class="dd" style="margin:-6px 0 6px">카드사별 사용금액 · 은행 인출액과 대조하세요</div><div class="cg">${Object.entries(cd).map(([c,v])=>`<div><small>${esc(c)} · ${v.n}건</small><b>${fmt(v.a)}</b></div>`).join('')}</div>
  <div class="box"><h3>정산 순서 ${cl?'🔒':''}</h3>${st.map(a=>`<div class="stp"><span class="ck ${a[2]?'ok':''}">${a[2]?'✓':''}</span><span>${a[0]}</span><small>${a[1]}</small></div>`).join('')}<p style="margin:8px 0 0"><button class="btn sub" id="cl">${cl?'마감 해제':'월 마감'}</button></p></div>
  ${cl?'':`<div class="acts"><label><input type="checkbox" id="all"> 점검 항목 전체선택</label> · <b id="sn">${S.sel.size}건 선택</b><br>${B.map(([k,l])=>`<button class="btn sub sm" data-a="${k}">${l}</button>`).join('')}</div>`}
  <div class="box"><div class="row" style="justify-content:space-between"><h3 style="margin:0">① 1차 점검 · 승인 대기 ${pend.length}건</h3>${cl?'':'<button class="btn sm" id="add" style="padding:6px 12px">＋ 추가</button>'}</div><small style="color:var(--mut)">문제 없는 항목은 미리 체크돼 있어요. [승인]을 누르면 아래 완료 내역으로 이동해요.</small>${pend.map(x=>row(x,cl,iw,1)).join('')||'<div class="empty">모두 승인했어요 🎉</div>'}</div>
  <div class="slip"><h2>③ 갱이 입금 요청</h2><div class="amt">${fmt(s.gg)}원</div><p>${nextMon(S.m)} 인출 · 고정비 제외, 분담비율 반영</p>
  <div class="row"><button class="btn" id="cp">카톡용 복사</button><label><input type="checkbox" id="pd" ${pd?'checked':''} ${cl?'disabled':''}>④ 입금 확인</label></div></div>
  ${up.length?`<div class="warn"><b>지난달보다 크게 늘어난 항목</b><div>${up.map(esc).join(' · ')}</div></div>`:''}
  <div class="box"><h3>완료 내역 ${done.length}건</h3><small style="color:var(--mut)">놓친 게 있으면 체크 후 위 버튼으로 수정하거나 [재점검]</small><div class="chips" style="margin-top:6px">${[['all','전체'],['용이','용이'],['갱이','갱이'],['fix','고정비']].map(([k,l])=>`<button data-f="${k}" class="${S.f===k?'on':''}">${l}</button>`).join('')}</div>${dl.map(x=>row(x,cl,iw,0)).join('')||'<div class="empty">완료된 내역이 없어요.</div>'}</div>`;
  $('#ms').onchange=e=>{S.m=e.target.value;vM()};$('#pv').onclick=()=>{S.m=ms[i+1];vM()};$('#nx').onclick=()=>{S.m=ms[i-1];vM()};
  $('#cp').onclick=()=>{if(pend.length&&!confirm('승인 대기 '+pend.length+'건이 남아 있어요. 그래도 복사할까요?'))return;copy(kakao(S.m))};
  $('#pd').onchange=async e=>{S.paid[S.m]=e.target.checked;await post({action:'setPaid',month:S.m,paid:e.target.checked});vM();toast(e.target.checked?'입금 확인 저장':'입금 확인 해제')};
  $('#cl').onclick=async()=>{if(!cl&&(pend.length||!pd)&&!confirm('아직 끝나지 않은 단계가 있어요. 그래도 마감할까요?'))return;await post({action:'setClosed',month:S.m,closed:!cl});await load()};
  if($('#add'))$('#add').onclick=addRow;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.f=b.dataset.f;vM()});
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));
  document.querySelectorAll('.ck2').forEach(c=>c.onchange=()=>{c.checked?S.sel.add(c.dataset.k):S.sel.delete(c.dataset.k);$('#sn').textContent=S.sel.size+'건 선택'});
  if($('#all'))$('#all').onchange=e=>{pend.forEach(x=>e.target.checked?S.sel.add(kx(x)):S.sel.delete(kx(x)));vM()}}
const SEED=[['KB손해보험','용이','의료/생활',1],['LGU+ 통신요금','용이','의료/생활',1],['LG전자 구독','용이','의료/생활',1],['교보라이프플래닛생명보험','용이','의료/생활',1],['프리티 모바일','용이','의료/생활',1],['롯데손해보험','용이','의료/생활',1],['삼성화재해상보험','용이','의료/생활',1],['관리비','용이','의료/생활',1],['GS25 LGD','용이','기타',0],['서울도시가스','용이','의료/생활',1],['브레인리그 운정학원','용이','의료/생활',1],['이마트','갱이','식비/카페',0],['트레이더스','갱이','식비/카페',0],['무신사','갱이','식비/카페',0],['홈플러스','갱이','식비/카페',0],['주유소','용이','교통/주유',0],['쿠팡','갱이','식비/카페',0],['올리브영','갱이','쇼핑/마트',0],['시네마','용이','기타',0],['롯데아울렛 파주점','갱이','쇼핑/마트',0],['유니클로','갱이','쇼핑/마트',0],['GS25 파크타운점','갱이','식비/카페',0],['닥터디퍼런트','갱이','쇼핑/마트',0],['알리익스프레스','용이','기타',0],['서울SUN치과병원','갱이','의료/생활',0],['병원','갱이','의료/생활',0],['스타필드','갱이','쇼핑/마트',0],['산부인과의원','갱이','의료/생활',0],['약국','갱이','의료/생활',0],['버거킹','용이','식비/카페',0],['자동차검사비','갱이','기타',0],['롯데쇼핑','갱이','쇼핑/마트',0]];
function vR(){const rs=S.rows.filter(x=>x.m===S.m),mt=(x,r)=>x.shop.toLowerCase().includes(r.keyword.toLowerCase());
  const un=[...new Set(S.rows.filter(x=>!bad(x)&&!S.rules.some(r=>mt(x,r))).map(x=>x.shop.replace(/\s*[\(\|].*$/,'').trim()))].slice(0,10),R=S.rules.slice().sort((a,b)=>b.fix-a.fix);
  $('#v').innerHTML=`<div class="box"><h3>규칙 추가</h3><div class="f"><input id="k" class="w" placeholder="가맹점 키워드 (예: 관리비)"><select id="ow"><option>용이</option><option>갱이</option></select><input id="ct" placeholder="카테고리"><label class="w"><input id="fx" type="checkbox">고정비 (용이 부담)</label></div><p style="margin:8px 0 0"><button class="btn" id="ad">추가</button> ${S.rules.length?'':'<button class="btn sub" id="sd">기본 규칙 불러오기</button>'}</p></div>
  ${un.length?`<div class="warn"><b>규칙 없는 가맹점 ${un.length}곳</b>${un.map(k=>`<div>${esc(k)} <button class="btn sub" style="padding:2px 8px;font-size:12px" data-u="${esc(k)}">규칙으로</button></div>`).join('')}</div>`:''}
  <div class="box"><h3>규칙 ${S.rules.length}개</h3>${R.map(r=>{const h=rs.filter(x=>mt(x,r)),a=h.reduce((t,x)=>t+x.amt,0);
    return`<div class="item"><div class="nm"><span>${r.fix?'<span class="tag f">고정</span>':''}${esc(r.keyword)}</span><small>${esc(r.owner)} · ${esc(r.cat)}</small></div><span class="am" style="text-align:right">${h.length?fmt(a)+'<br><small style="color:var(--mut)">'+h.length+'건</small>':(r.fix?'<b style="color:var(--warn)">미결제</b>':'')}</span><button class="ib" data-d="${esc(r.keyword)}" aria-label="삭제">✕</button></div>`}).join('')||'<div class="empty">규칙이 없어요.</div>'}</div>`;
  $('#ad').onclick=async()=>{const k=$('#k').value.trim();if(!k)return toast('키워드를 입력하세요');await post({action:'saveRule',keyword:k,owner:$('#ow').value,cat:$('#ct').value.trim(),fix:$('#fx').checked});await load()};
  if($('#sd'))$('#sd').onclick=async()=>{await post({action:'saveRules',rules:SEED.map(a=>({keyword:a[0],owner:a[1],cat:a[2],fix:!!a[3]}))});await load()};
  document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{$('#k').value=b.dataset.u;$('#k').focus();scrollTo(0,0)});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm(b.dataset.d+' 규칙을 삭제할까요?')){await post({action:'delRule',keyword:b.dataset.d});await load()}})}
function vS(){const ms=months().slice().reverse().slice(-12),D=ms.map(m=>({m,...sum(m)})),mx=Math.max(1,...D.map(d=>d.t));
  const yr=(S.m||'').slice(0,4),Y=D.filter(d=>d.m.startsWith(yr)),cat={},shop={};
  S.rows.filter(x=>!bad(x)&&x.m.startsWith(yr)&&x.amt>0).forEach(x=>{cat[x.cat||'기타']=(cat[x.cat||'기타']||0)+x.amt;const k=x.shop.replace(/\s*[\(\|].*$/,'').trim();shop[k]=(shop[k]||0)+x.amt});
  const ct=Object.entries(cat).sort((a,b)=>b[1]-a[1]),cm=ct[0]?ct[0][1]:1,tp=Object.entries(shop).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const un=D.filter(d=>d.gg>0&&!S.paid[d.m]);
  $('#v').innerHTML=`<div class="box"><h3>갱이 ${yr}년 누적 ${fmt(Y.reduce((t,d)=>t+d.gg,0))}원</h3>${un.length?`<div class="warn" style="margin:0"><b>입금 미확인</b>${un.map(d=>`<div>${+d.m.slice(5)}월 ${fmt(d.gg)}원</div>`).join('')}</div>`:'<small style="color:var(--mut)">미확인 입금 없음</small>'}</div>
  <div class="box"><h3>월별 총액 <small style="font-weight:400;color:var(--mut)">고정 ■ 변동 ■</small></h3>${D.slice().reverse().map(d=>`<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><span>${d.m.slice(2).replace('-','.')}</span><span>${fmt(d.t)} <small style="color:var(--mut)">용이 ${fmt(d.yy)} · 갱이 ${fmt(d.gg)}</small></span></div><div class="hb" style="width:${d.t/mx*100}%"><i style="width:${d.fx/(d.t||1)*100}%;background:var(--fix)"></i><i style="flex:1;background:var(--yong)"></i></div></div>`).join('')}</div>
  <div class="box"><h3>${yr}년 카테고리</h3>${ct.map(([k,v])=>`<div style="margin-bottom:8px"><div class="row" style="justify-content:space-between"><span>${esc(k)}</span><span>${fmt(v)}</span></div><div class="hb" style="width:${v/cm*100}%"><i style="flex:1;background:var(--ink)"></i></div></div>`).join('')}</div>
  ${(()=>{const L=D.slice(-4),cs=[...new Set(S.rows.filter(x=>!bad(x)).map(x=>x.card||'기타'))];return`<div class="box"><h3>카드사별 추이</h3><table style="width:100%;font-size:13px;border-collapse:collapse"><tr><th></th>${L.map(d=>`<th>${+d.m.slice(5)}월</th>`).join('')}</tr>${cs.map(c=>`<tr><td>${esc(c)}</td>${L.map(d=>`<td style="text-align:right">${fmt(d.rs.filter(x=>(x.card||'기타')===c).reduce((t,x)=>t+x.amt,0))}</td>`).join('')}</tr>`).join('')}</table></div>`})()}
  <div class="box"><h3>${yr}년 가맹점 TOP 5</h3>${tp.map(([k,v])=>`<div class="item"><span class="nm"><span>${esc(k)}</span></span><span class="am">${fmt(v)}</span></div>`).join('')}</div>`}
document.querySelectorAll('nav button[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});$('#gear').onclick=setup;load();
</script></body></html>
